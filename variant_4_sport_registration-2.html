<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на спортивний захід</title>
</head>
<body>
    <h1>Реєстрація на спортивний захід</h1>

    <form>
        <label for="name">Ім'я:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="surname">Прізвище:</label><br>
        <input type="text" id="surname" name="surname" required><br><br>

        <label for="email">Електронна пошта:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Номер телефону:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="age">Вік:</label><br>
        <input type="number" id="age" name="age" min="12" max="80"><br><br>

        <label for="date">Дата участі:</label><br>
        <input type="date" id="date" name="date" required><br><br>

        <p>Оберіть дистанцію:</p>
        <input type="radio" id="2km" name="distance" value="2 км" required>
        <label for="2km">2 км</label><br>
        <input type="radio" id="5km" name="distance" value="5 км">
        <label for="5km">5 км</label><br>
        <input type="radio" id="10km" name="distance" value="10 км">
        <label for="10km">10 км</label><br><br>

        <p>Додаткові можливості:</p>
        <input type="checkbox" id="shirt" name="extra" value="Футболка">
        <label for="shirt">Отримати футболку</label><br>
        <input type="checkbox" id="medal" name="extra" value="Медаль">
        <label for="medal">Отримати медаль</label><br>
        <input type="checkbox" id="news" name="extra" value="Новини">
        <label for="news">Отримувати новини про наступні заходи</label><br>
        <input type="checkbox" id="rating" name="extra" value="Рейтинг">
        <label for="rating">Додати результати до загального рейтингу</label><br><br>

        <label for="category">Категорія учасника:</label><br>
        <select id="category" name="category">
            <option value="Учень">Учень</option>
            <option value="Студент">Студент</option>
            <option value="Дорослий">Дорослий</option>
            <option value="Інша категорія">Інша категорія</option>
        </select><br><br>

        <label for="info">Додаткова інформація для організаторів:</label><br>
        <textarea id="info" name="info" maxlength="250" rows="5" cols="40"></textarea><br><br>

        <button type="submit">Зареєструватися</button>
        <button type="reset">Очистити</button>
    </form>
</body>
</html>
